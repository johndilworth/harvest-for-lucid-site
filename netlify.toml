# Static concept site: no build step; publish site/ as-is.
[build]
  publish = "site"
  command = "echo static site, no build"
  environment = { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1" }

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
