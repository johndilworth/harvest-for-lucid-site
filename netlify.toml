# Static concept site: no build step; publish site/ as-is.
[build]
  publish = "site"
  command = "echo static site, no build"
  environment = { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1" }

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cycle 3: one-page site. Old pages point back to the home page.
[[redirects]]
  from = "/how-it-works"
  to = "/#how"
  status = 301
[[redirects]]
  from = "/pricing"
  to = "/"
  status = 301
[[redirects]]
  from = "/beta"
  to = "/"
  status = 301
