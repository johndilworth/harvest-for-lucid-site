# Harvest review flows for the Harvest for Lucidchart concept site.
# Each step = one screen (1440x1024 viewport shot). Screens are keyed by route + document.title + h1 + clicked element;
# there are no data-* / journey ids in the site. Long pages are split into several viewport screens with
# `scroll: { to: {role, name} }` (element placed `offset` px below the top, below the sticky 60px nav).
# `prepare` runs before the shot; `action` is the single advancing click that gets the 3x cursor overlay.
# Cycle 2 (PR #1): the Lucid global bar and the announcement banner are gone; the only header is the sticky 60px Harvest
# nav (Overview / How it works / Pricing / Beta + "Join the beta" button). Page title on / is now "Harvest | Lucid".
# The beta flow still enters via the hero link "Get early access" (the nav "Join the beta" goes to the same /beta).
# Cycle 3 (9f6f8db): one-page site. /how-it-works, /pricing, /beta now 301 to /. Nav links jump to sections.
# The 11 home screens are split into three flows/boards (5-screen board rule): story (5), proof (3), close (3).
version: 1
base_url: https://harvest-for-lucid.netlify.app
viewport: { width: 1440, height: 1024 }
flows:
  - key: home-story
    name: "Home: problem, loop, benefits, agents"
    start_url: /
    steps:
      - key: home-01-hero
        expect: { route: /, h1: Every sticky note becomes a change }
      - key: home-02-problem
        expect: { route: / }
        scroll: { to: { role: heading, name: "Prototyping with AI shouldn’t be a one-person chat" }, offset: 140 }
      - key: home-03-how
        expect: { route: / }
        scroll: { to: { role: heading, name: "Review. Harvest. Ship. Repeat." }, offset: 140 }
      - key: home-04-benefits
        expect: { route: / }
        scroll: { to: { role: heading, name: "Design with your whole team, not just a chat window" }, offset: 140 }
      - key: home-05-agents
        expect: { route: / }
        scroll: { to: { role: heading, name: "Works with your agents" }, offset: 140 }
  - key: home-proof
    name: "Home: before/after, paper trail, results"
    start_url: /
    steps:
      - key: home-06-before-after
        expect: { route: / }
        scroll: { to: { role: heading, name: "See every cycle, side by side" }, offset: 140 }
      - key: home-07-paper-trail
        expect: { route: / }
        scroll: { to: { role: heading, name: "A paper trail beside every pull request" }, offset: 140 }
      - key: home-08-results
        expect: { route: / }
        scroll: { to: { role: heading, name: "Three review cycles in one evening" }, offset: 140 }
  - key: home-close
    name: "Home: compare, Lucidchart, closing"
    start_url: /
    steps:
      - key: home-09-compare
        expect: { route: / }
        scroll: { to: { role: heading, name: "Where Harvest fits" }, offset: 140 }
      - key: home-10-suite
        expect: { route: / }
        scroll: { to: { role: heading, name: "Built on the Lucidchart your team already uses" }, offset: 200 }
      - key: home-11-cta-footer
        expect: { route: / }
        scroll: { bottom: true }
